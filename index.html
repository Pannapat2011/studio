<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ป้ายยาสตูดิโอ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one working column — "add product" composer on top, shared clip library below, big tap targets for two people sharing it */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18202B; --muted:#5D6877; --line:#DCE1E7;
  --accent:#E2551F; --accent-ink:#FFFFFF; --accent-soft:#FCE9E1;
  --fb:#2F5FB3; --fb-soft:#E3EBF8; --ok:#1F7A4D; --ok-soft:#E2F3EA; --danger:#B3261E;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1B2129; --ink:#E9EDF2; --muted:#9AA5B3; --line:#2D3540;
  --accent:#FF7A45; --accent-ink:#1A0E08; --accent-soft:#3A2218;
  --fb:#86A9EC; --fb-soft:#1E2A40; --ok:#6CCB98; --ok-soft:#173326; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --ink:#E9EDF2; --muted:#9AA5B3; --line:#2D3540;
  --accent:#FF7A45; --accent-ink:#1A0E08; --accent-soft:#3A2218;
  --fb:#86A9EC; --fb-soft:#1E2A40; --ok:#6CCB98; --ok-soft:#173326; --danger:#F2867E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:24px}
header{display:grid;gap:4px}
h1{font-family:var(--display);font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{color:var(--muted);margin:0;max-width:60ch}
h2{font-family:var(--display);font-size:22px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
label{font-weight:600;font-size:15px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px 18px;font-family:var(--display)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{color:var(--muted);font-size:14px}
.status.err{color:var(--danger)}
.caps{display:grid;gap:18px}
.platform{display:grid;gap:10px}
.ptag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;width:fit-content}
.ptag.sp{background:var(--accent-soft);color:var(--accent)}
.ptag.fb{background:var(--fb-soft);color:var(--fb)}
.cap{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--bg)}
.cap .style{font-size:13px;color:var(--muted);font-weight:600}
.cap pre{white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--body);font-size:15px}
.cap .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.copy{padding:8px 14px}
.copy.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.item summary::-webkit-details-marker{display:none}
.item .name{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere}
.item .sub{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:6px 12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on.sp{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.on.fb{background:var(--fb-soft);color:var(--fb);border-color:transparent}
.chip.ex{border-style:dashed}
.body{padding:0 16px 16px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts a{color:var(--fb)}
.toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.danger{color:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;color:var(--muted);text-align:center}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.notice{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.cap{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <h1>ป้ายยา<span>สตูดิโอ</span></h1>
    <p class="lede">ใส่ข้อมูลสินค้า แล้วให้ AI คิดแคปชั่นสำหรับ Shopee Video และ Facebook ให้ทันที ทุกอย่างเก็บไว้ในคลังที่ใช้ร่วมกันได้</p>
  </header>

  <section class="panel" aria-labelledby="addH">
    <h2 id="addH">เพิ่มสินค้าใหม่</h2>
    <form id="form" class="grid2" autocomplete="off">
      <div class="field" style="grid-column:1/-1">
        <label for="f-name">ชื่อสินค้า</label>
        <input id="f-name" required placeholder="เช่น พัดลมพกพา ไร้ใบพัด ชาร์จ USB">
      </div>
      <div class="field">
        <label for="f-price">ราคา <span class="hint">(บาท)</span></label>
        <input id="f-price" inputmode="decimal" placeholder="เช่น 199">
      </div>
      <div class="field">
        <label for="f-promo">โปรโมชั่น <span class="hint">(ถ้ามี)</span></label>
        <input id="f-promo" placeholder="เช่น ลด 50% ส่งฟรี">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label for="f-points">จุดเด่นสินค้า <span class="hint">(พิมพ์สั้น ๆ คนละบรรทัดก็ได้)</span></label>
        <textarea id="f-points" placeholder="ลมแรง 3 ระดับ&#10;ใช้ได้ 8 ชั่วโมง&#10;เสียงเงียบ"></textarea>
      </div>
      <div class="field">
        <label for="f-link">ลิงก์ affiliate</label>
        <input id="f-link" inputmode="url" placeholder="https://s.shopee.co.th/...">
      </div>
      <div class="field">
        <label for="f-clip">คลิปอยู่ที่ไหน <span class="hint">(ลิงก์ Drive/LINE หรือชื่อไฟล์)</span></label>
        <input id="f-clip" placeholder="เช่น ลิงก์ Google Drive จากร้าน">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label for="f-tone">อยากได้แคปชั่นแนวไหนเพิ่มเติม <span class="hint">(ไม่ใส่ก็ได้)</span></label>
        <input id="f-tone" placeholder="เช่น ตลก ๆ, เน้นคุณแม่บ้าน, เน้นวัยรุ่น">
      </div>
      <div class="row" style="grid-column:1/-1">
        <button class="primary" id="genBtn" type="submit">คิดแคปชั่นให้หน่อย</button>
        <span class="status" id="genStatus" role="status"></span>
      </div>
    </form>
    <div id="result" class="caps" hidden></div>
  </section>

  <section class="list" aria-labelledby="libH">
    <div class="row" style="justify-content:space-between">
      <h2 id="libH">คลังสินค้า</h2>
      <div class="filters" role="group" aria-label="กรอง">
        <button type="button" data-f="all" aria-pressed="true">ทั้งหมด</button>
        <button type="button" data-f="todo" aria-pressed="false">ยังโพสต์ไม่ครบ</button>
        <button type="button" data-f="done" aria-pressed="false">โพสต์ครบแล้ว</button>
      </div>
    </div>
    <div id="libNote" class="notice" hidden></div>
    <div id="items" class="list">
      <div class="empty">ยังไม่มีสินค้าในคลัง กรอกข้อมูลด้านบนแล้วกด “คิดแคปชั่นให้หน่อย” สินค้าจะมาอยู่ตรงนี้</div>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  let db = null, sample = null, user = null, myId = null;
  let products = [], filter = "all", lastSavedId = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const errText = code => ({
    not_granted:"ยังไม่ได้อนุญาตให้ใช้ AI กดปุ่มอีกครั้งแล้วเลือก “อนุญาต”",
    rate_limited:"ใช้ถี่ไปหน่อย รอสักครู่แล้วลองใหม่",
    invalid_json:"AI ตอบมาไม่ครบ ลองกดอีกครั้ง",
    refused:"AI ไม่สามารถเขียนแคปชั่นนี้ได้ ลองปรับข้อมูลสินค้า",
    cancelled:"ยกเลิกแล้ว",
    session_expired:"หมดเวลาเข้าระบบ ลองรีเฟรชหน้า"
  })[code] || "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";

  function buildPrompt(p){
    return `คุณคือนักเขียนแคปชั่นขายของออนไลน์ภาษาไทยมือโปร สำหรับคลิปวิดีโอ affiliate
ข้อมูลสินค้า:
- ชื่อ: ${p.name}
- ราคา: ${p.price || "ไม่ระบุ"} บาท
- โปรโมชั่น: ${p.promo || "ไม่มี"}
- จุดเด่น: ${p.points || "ไม่ระบุ"}
- แนวที่ผู้ใช้อยากได้เพิ่ม: ${p.tone || "ไม่ระบุ"}

เขียนแคปชั่น 2 แพลตฟอร์ม แพลตฟอร์มละ 3 แบบ แต่ละแบบคนละสไตล์ (เช่น ป้ายยาแบบเพื่อนบอกเพื่อน, เน้นโปรแรงกระตุ้นให้รีบ, ตลก/เล่าเรื่อง หรือแนวที่ผู้ใช้ขอ)
กติกา:
- Shopee Video: สั้น กระชับ ไม่เกิน 150 ตัวอักษรรวมแฮชแท็ก ประโยคแรกต้องหยุดนิ้ว ไม่ต้องใส่ลิงก์ ใส่แฮชแท็ก 3-4 อัน
- Facebook: ประโยคแรกเป็นฮุกแรง ๆ 3-6 บรรทัด ใช้อีโมจิได้พอประมาณ ปิดด้วยการชวนกดลิงก์ ให้เขียนคำว่า [ลิงก์] ตรงตำแหน่งที่จะวางลิงก์ แล้วตามด้วยแฮชแท็ก 3-5 อัน
- ห้ามอ้างสรรพคุณเกินจริงหรือข้อมูลที่ไม่ได้ให้มา ห้ามอ้างทางการแพทย์ ห้ามแต่งรีวิวว่าเป็นของลูกค้าจริง
- ภาษาเป็นกันเอง เป็นธรรมชาติแบบคนไทยขายของออนไลน์

ตอบเป็น JSON อย่างเดียวในรูปแบบนี้:
{"shopee":[{"style":"ชื่อสไตล์สั้น ๆ","text":"แคปชั่น"}],"facebook":[{"style":"...","text":"..."}]}`;
  }

  function cleanCaps(raw){
    const take = arr => (Array.isArray(arr) ? arr : []).filter(c => c && typeof c.text === "string")
      .slice(0, 5).map(c => ({ style: String(c.style || "แคปชั่น").slice(0, 60), text: c.text.trim() }));
    return { shopee: take(raw && raw.shopee), facebook: take(raw && raw.facebook) };
  }

  function fillLink(text, link){ return link ? text.replace(/\[ลิงก์\]/g, link) : text; }

  function capHTML(c, plat, link, idx, pid){
    const text = plat === "facebook" ? fillLink(c.text, link) : c.text;
    return `<div class="cap"><div class="style">${esc(c.style)}</div><pre>${esc(text)}</pre>
      <div class="meta"><span class="count">${[...text].length} ตัวอักษร</span>
      <button type="button" class="copy" data-pid="${esc(pid)}" data-plat="${plat}" data-i="${idx}">คัดลอก</button></div></div>`;
  }

  function capsHTML(p){
    const caps = p.captions || {shopee:[],facebook:[]};
    let h = "";
    if (caps.shopee.length) h += `<div class="platform"><span class="ptag sp">SHOPEE VIDEO</span>${caps.shopee.map((c,i)=>capHTML(c,"shopee",p.link,i,p.id)).join("")}</div>`;
    if (caps.facebook.length) h += `<div class="platform"><span class="ptag fb">FACEBOOK</span>${caps.facebook.map((c,i)=>capHTML(c,"facebook",p.link,i,p.id)).join("")}</div>`;
    return h || `<p class="status">ยังไม่มีแคปชั่น</p>`;
  }

  // copy handler (delegated)
  document.addEventListener("click", async e => {
    const b = e.target.closest(".copy"); if (!b) return;
    const p = products.find(x => x.id === b.dataset.pid) || (window.__draft && window.__draft.id === b.dataset.pid ? window.__draft : null);
    if (!p) return;
    const c = p.captions[b.dataset.plat][+b.dataset.i];
    const text = b.dataset.plat === "facebook" ? fillLink(c.text, p.link) : c.text;
    try { await navigator.clipboard.writeText(text); b.textContent = "คัดลอกแล้ว ✓"; b.classList.add("done"); }
    catch { const pre = b.closest(".cap").querySelector("pre"); const r = document.createRange(); r.selectNodeContents(pre);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "เลือกข้อความแล้ว กดคัดลอกเอง"; }
    setTimeout(() => { b.textContent = "คัดลอก"; b.classList.remove("done"); }, 2200);
  });

  // generate
  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const p = { name:$("#f-name").value.trim(), price:$("#f-price").value.trim(), promo:$("#f-promo").value.trim(),
      points:$("#f-points").value.trim(), link:$("#f-link").value.trim(), clip:$("#f-clip").value.trim(), tone:$("#f-tone").value.trim() };
    if (!p.name) return;
    const st = $("#genStatus"), btn = $("#genBtn");
    if (!sample) { st.textContent = "ตอนนี้ยังเชื่อมต่อ AI ไม่ได้ ลองรีเฟรชหน้า"; st.className = "status err"; return; }
    btn.disabled = true; st.className = "status"; st.textContent = "กำลังคิดแคปชั่น... (ประมาณ 10–30 วินาที)";
    try {
      const raw = await sample.json(buildPrompt(p), { modelTier: "default", cache: false });
      const captions = cleanCaps(raw);
      if (!captions.shopee.length && !captions.facebook.length) throw { code: "invalid_json" };
      const doc = { ...p, captions, postedShopee:false, postedFb:false, createdAt: Date.now(), createdBy: myId || null };
      let id = "draft";
      if (db) {
        try { const ref = await db.collection("products").add(doc); id = ref.id; lastSavedId = id; st.textContent = "เสร็จแล้ว บันทึกลงคลังให้แล้ว"; }
        catch (err) { st.textContent = "ได้แคปชั่นแล้ว แต่บันทึกลงคลังไม่สำเร็จ (อาจยังไม่มีสิทธิ์แก้ไข)"; }
      } else st.textContent = "ได้แคปชั่นแล้ว (ยังบันทึกลงคลังไม่ได้)";
      window.__draft = { ...doc, id };
      const r = $("#result"); r.hidden = false; r.innerHTML = capsHTML(window.__draft);
      $("#form").reset();
    } catch (err) {
      st.className = "status err"; st.textContent = errText(err && err.code);
    } finally { btn.disabled = false; }
  });

  // library
  const fmtDate = t => t ? new Date(t).toLocaleDateString("th-TH", { day:"numeric", month:"short" }) : "";
  async function renderList(){
    const box = $("#items");
    let list = products.slice();
    if (filter === "todo") list = list.filter(p => !(p.postedShopee && p.postedFb));
    if (filter === "done") list = list.filter(p => p.postedShopee && p.postedFb);
    if (!products.length) { box.innerHTML = `<div class="empty">ยังไม่มีสินค้าในคลัง กรอกข้อมูลด้านบนแล้วกด “คิดแคปชั่นให้หน่อย” สินค้าจะมาอยู่ตรงนี้</div>`; return; }
    if (!list.length) { box.innerHTML = `<div class="empty">ไม่มีสินค้าในหมวดนี้</div>`; return; }
    let names = {};
    if (user) { try { const ids = [...new Set(list.map(p=>p.createdBy).filter(Boolean))]; if (ids.length) names = await user.profiles(ids); } catch {} }
    const open = new Set([...box.querySelectorAll("details[open]")].map(d => d.dataset.id));
    if (lastSavedId) { open.add(lastSavedId); lastSavedId = null; }
    box.innerHTML = list.map(p => {
      const who = p.createdBy ? ((names[p.createdBy] && names[p.createdBy].name) || "") : "";
      return `<details class="item" data-id="${esc(p.id)}" ${open.has(p.id) ? "open" : ""}>
      <summary><span class="name">${esc(p.name)}</span>
        <span class="chips">${p.example ? `<span class="chip ex">ตัวอย่าง</span>` : ""}
          <span class="chip sp ${p.postedShopee ? "on" : ""}">${p.postedShopee ? "✓ " : ""}Shopee</span>
          <span class="chip fb ${p.postedFb ? "on" : ""}">${p.postedFb ? "✓ " : ""}Facebook</span></span>
        <span class="sub">${p.price ? `<span>${esc(p.price)} บาท</span>` : ""}${p.promo ? `<span>${esc(p.promo)}</span>` : ""}<span>เพิ่มเมื่อ ${fmtDate(p.createdAt)}${who ? " โดย " + esc(who) : ""}</span></span>
      </summary>
      <div class="body">
        <dl class="facts">
          ${p.link ? `<dt>ลิงก์</dt><dd><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a></dd>` : ""}
          ${p.clip ? `<dt>คลิป</dt><dd>${/^https?:\/\//.test(p.clip) ? `<a href="${esc(p.clip)}" target="_blank" rel="noopener">${esc(p.clip)}</a>` : esc(p.clip)}</dd>` : ""}
          ${p.points ? `<dt>จุดเด่น</dt><dd>${esc(p.points).replace(/\n/g,"<br>")}</dd>` : ""}
        </dl>
        <div class="row">
          <label class="toggle"><input type="checkbox" data-act="sp" ${p.postedShopee ? "checked" : ""}> โพสต์ Shopee แล้ว</label>
          <label class="toggle"><input type="checkbox" data-act="fb" ${p.postedFb ? "checked" : ""}> โพสต์ Facebook แล้ว</label>
        </div>
        <div class="caps">${capsHTML(p)}</div>
        <div class="row">
          <button type="button" data-act="reuse">คิดแคปชั่นใหม่จากสินค้านี้</button>
          <button type="button" data-act="del" class="danger">ลบ</button>
          <span class="confirm" hidden><span class="status">ลบจริงไหม?</span> <button type="button" data-act="del-yes" class="danger">ลบเลย</button> <button type="button" data-act="del-no">ไม่ลบ</button></span>
        </div>
      </div></details>`;
    }).join("");
  }

  $("#items").addEventListener("change", async e => {
    const cb = e.target.closest("input[data-act]"); if (!cb || !db) return;
    const id = cb.closest("details").dataset.id;
    try { await db.doc("products/" + id).update(cb.dataset.act === "sp" ? { postedShopee: cb.checked } : { postedFb: cb.checked }); }
    catch { cb.checked = !cb.checked; showNote("บันทึกไม่สำเร็จ บัญชีนี้อาจมีสิทธิ์แค่ดูอย่างเดียว"); }
  });
  $("#items").addEventListener("click", async e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const d = b.closest("details"), id = d.dataset.id, p = products.find(x => x.id === id);
    const act = b.dataset.act;
    if (act === "del") d.querySelector(".confirm").hidden = false;
    if (act === "del-no") d.querySelector(".confirm").hidden = true;
    if (act === "del-yes" && db) { try { await db.doc("products/" + id).delete(); } catch { showNote("ลบไม่สำเร็จ บัญชีนี้อาจมีสิทธิ์แค่ดูอย่างเดียว"); } }
    if (act === "reuse" && p) {
      $("#f-name").value = p.name || ""; $("#f-price").value = p.price || ""; $("#f-promo").value = p.promo || "";
      $("#f-points").value = p.points || ""; $("#f-link").value = p.link || ""; $("#f-clip").value = p.clip || ""; $("#f-tone").value = p.tone || "";
      $("#f-name").scrollIntoView({ behavior: "smooth", block: "center" }); $("#f-name").focus({ preventScroll: true });
    }
  });
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f; document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderList();
  }));
  function showNote(t){ const n = $("#libNote"); n.textContent = t; n.hidden = false; setTimeout(() => n.hidden = true, 5000); }

  // boot
  (async () => {
    if (!window.claude) { showNote("เปิดหน้านี้ในแอป Claude เพื่อใช้ AI และคลังสินค้า"); return; }
    claude.use("sample").then(s => { sample = s; if (!s) { $("#genStatus").textContent = "ตอนนี้ใช้ AI ไม่ได้ในมุมมองนี้"; } });
    user = await claude.use("user");
    if (user) { try { myId = await user.id(); } catch {} }
    db = await claude.use("db");
    if (!db) { showNote("ต้องลงชื่อเข้าใช้ Claude ก่อน ถึงจะเห็นคลังสินค้า"); return; }
    db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    }, () => showNote("โหลดคลังสินค้าไม่สำเร็จ ลองรีเฟรชหน้า"));
  })();
})();
</script>

</body></html>
